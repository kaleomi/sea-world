<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Game HUD states</title>
	<style>body { margin: 0; background: linear-gradient(180deg, #6fa7d6 0%, #9cc9e8 45%, #1f8fa3 46%, #0c5f77 100%); height: 100vh; }</style>
</head>
<body>
<script type="module">
// Dev page: the fishing game's HUD in every state, over a flat sky / sea backdrop.
// ?view=fight | inv | dex | stand | shop | cast | bite | catch | record | newspecies | full | milestone | legend | tour | online | quest | map
import '../src/ui/ui.css';
import { GameHUD } from '../src/game/GameHUD.js';
import { GameState } from '../src/game/GameState.js';
import { place } from '../src/game/Tournament.js';
import { GIVERS } from '../src/game/Quests.js';
import { WorldMap } from '../src/game/WorldMap.js';

const view = new URLSearchParams( location.search ).get( 'view' ) || 'fight';
const root = document.createElement( 'div' );
root.className = 'tw-root';
const hud = document.createElement( 'div' );
hud.className = 'tw-hud';
const toasts = document.createElement( 'div' );
toasts.className = 'tw-toasts';
hud.append( toasts );
root.append( hud );
document.body.append( root );
const ui = { root, hud, toast( t ) { const e = document.createElement( 'div' ); e.className = 'tw-toast tw-glass is-in'; e.textContent = t; toasts.append( e ); } };
const state = new GameState( null );
state.money = 184;
// Joe's board: one order the cooler can fill, one half done, one not started (and a bit of reputation)
state.orders.rep = 6;
state.orders.list = [
	{ id: 1, species: 'grunt', count: 1, minKg: 0.6, reward: 20, rep: 1 },
	{ id: 2, species: 'yellowtail', count: 2, minKg: 0.8, reward: 55, rep: 2 },
	{ id: 3, species: 'parrot', count: 1, minKg: 1.6, reward: 45, rep: 2 },
];
state.orders.nextId = 4;
// the tournament on offer at the stand; in ?view=tour one is running (a bag event, the catches below weighed in)
state.circuit.offer = { kind: view === 'tour' ? 'bag' : 'species', species: view === 'tour' ? null : 'yellowtail', league: 0 };
if ( view === 'tour' ) { state.money += 20; state.rng = ( ( s ) => () => ( ( s = ( s * 1664525 + 1013904223 ) >>> 0 ) / 4294967296 ) )( 3 ); state.enterTournament(); }
state.addFish( 'yellowtail', 1.31, 9 );
state.addFish( 'grunt', 0.84, 9.5 );
state.addFish( 'jack', 4.6, 10 );
state.addFish( 'barracuda', 3.2, 11 );
const game = { state, sellAll( w ) { state.sell( null, w ); }, refuel( p ) { state.refuel( p ); }, sell( ids ) { state.sell( ids ); }, fillOrder( id ) { return state.fillOrder( id ); }, dropOrder( id ) { return state.dropOrder( id ); }, enterTournament() { return state.enterTournament(); }, withdrawTournament() { return state.withdrawTournament(); } };
// ?view=online: the shared-sea view, online with two others (a stand-in for net/Multiplayer)
if ( view === 'online' ) {

	const colors = [ '#e2574c', '#f2a541', '#e8d44d', '#5fbf6a', '#3fb6c8', '#4f7fe0', '#9b6ad6', '#e070b0' ];
	const peers = new Map( [ [ 2, { name: '阿海', color: '#5fbf6a' } ], [ 3, { name: 'Marisol', color: '#9b6ad6' } ] ] );
	game.app = { net: { status: 'online', error: null, colors, client: { peers }, settings: { name: 'Kaleomi', color: '#3fb6c8', server: 'ws://127.0.0.1:5191' },
		players() { return [ { name: this.settings.name, color: this.settings.color, you: true }, ...peers.values() ]; }, onChange() {}, connect() {}, disconnect() {} } };

}
const h = new GameHUD( ui, game );
// ?view=quest: Nalu on the atoll, the first job half done
if ( view === 'quest' ) {

	state.addFish( 'tang', 0.34, 9 );
	state.addFish( 'chromis', 0.06, 9 );
	game.completeQuest = ( id ) => state.completeQuest( id );
	h.openStand( { kind: 'quest', giver: 'nalu', name: GIVERS.nalu.name, post: {} } );

}

// ?view=map: the full map over stand-in island bakes (a disc per island), you at sea near the atoll
if ( view === 'map' ) {

	const layer = ( x0, z0, ext, r, color ) => {

		const c = document.createElement( 'canvas' );
		c.width = c.height = 256;
		const g = c.getContext( '2d' );
		g.fillStyle = '#0c2c4e'; g.fillRect( 0, 0, 256, 256 );
		g.fillStyle = '#3ebabe'; g.beginPath(); g.arc( 128, 128, r * 1.3, 0, 7 ); g.fill();
		g.fillStyle = color; g.beginPath(); g.arc( 128, 128, r, 0, 7 ); g.fill();
		return { canvas: c, x0, z0, n: 256, ppm: 256 / ext };

	};
	// the real outer islands (generated in workers), drawn with a simple height palette
	const { buildOuterIslands } = await import( '../src/world/terrain/OuterIslands.js' );
	const { OUTER_ISLANDS } = await import( '../src/world/islands/index.js' );
	const { beachSpot } = await import( '../src/game/Quests.js' );
	const outer = await buildOuterIslands( OUTER_ISLANDS, { cache: false } );
	const real = ( o ) => {

		const c = document.createElement( 'canvas' );
		c.width = c.height = 256;
		const g = c.getContext( '2d' ), img = g.createImageData( 256, 256 );
		for ( let j = 0; j < 256; j ++ ) for ( let i = 0; i < 256; i ++ ) {

			const h = o.heightAt( o.x0 + ( i + 0.5 ) * 4, o.z0 + ( j + 0.5 ) * 4 ), k = ( j * 256 + i ) * 4;
			const t = Math.min( 1, - h / 40 );
			const col = h < 0 ? [ 62 - 50 * t, 186 - 142 * t, 190 - 112 * t ] : h < 2 ? [ 226, 212, 160 ] : [ 90 + h, 140 - h * 0.3, 70 + h * 0.4 ];
			const edge = Math.min( i, j, 255 - i, 255 - j ) / 25.6;
			img.data.set( [ ...col, 255 * Math.min( 1, edge ) ], k );

		}

		g.putImageData( img, 0, 0 );
		return { canvas: c, x0: o.x0, z0: o.z0, n: 256, ppm: 256 / o.size };

	};
	const minimap = { _layers: [ layer( - 640, - 820, 1280, 70, '#80a058' ), ...outer.map( real ) ] };
	const e = new Array( 16 ).fill( 0 );
	e[ 8 ] = 0.6; e[ 10 ] = 0.8; // looking north-west-ish
	game.app = { camera: { matrixWorld: { elements: e }, position: { x: 1900, z: 1300 } }, player: { mode: 'boat' }, boatCtl: { position: { x: 1900, z: 1300 } },
		net: { remote: { positions: () => [ { x: 300, z: 200, color: '#9b6ad6', name: 'Marisol' } ] } }, worldWeather: { weather: true } };
	game.givers = Object.values( GIVERS ).map( ( g ) => {

		const o = outer.find( ( q ) => q.id === g.island ), s = beachSpot( o, 0, 0 );
		return { giver: g.id, name: g.name, position: { x: s.x, z: s.z } };

	} );
	game.questState = ( id ) => ( id === 'nalu' ? 'ready' : 'open' );
	const map = new WorldMap( root, game, minimap );
	map.toggle( true );
	setTimeout( () => map.update(), 50 );

}
const fight = { tension: 0.62, band: [ 0.35, 0.8 ], stamina: 0.55, distance: 11.4, surge: 0.1 };
h.update( { fuel: { litres: 23, tank: 40 }, sonar: { depth: 12.4, fish: 0.5 }, fight: view === 'fight' ? fight : null, casting: view === 'cast', power: 0.7, bite: view === 'bite', aiming: true, tourney: null, clock: { hour: 18.6, weather: 'Rain' } } );
if ( view === 'tour' ) {

	state.tickTournament( 170 );
	const a = state.circuit.active;
	h.update( { fuel: { litres: 23, tank: 40 }, sonar: { depth: 12.4, fish: 0.5 }, aiming: true, tourney: { left: a.left, score: a.score, place: place( state.circuit ) } } );
	h.openStand( { name: 'Joe · Fish buyer', greeting: 'Let\'s see what you caught. Fair prices, cash.' } );

}
if ( view === 'inv' ) h.toggleInventory( true );
if ( view === 'online' ) {

	h.toggleInventory( true );
	h.invView = 'online';
	h.renderInventory();

}
if ( view === 'dex' ) {

	// a few more species in the log, one of them at gold
	state.addFish( 'tang', 0.5, 10 );
	state.addFish( 'tuna', 13, 18 );
	// one legend on the trophy wall, the rest still rumours
	state.addLegend( 'ironjaw', 26.4 );
	h.toggleInventory( true );
	h.invView = 'dex';
	h.renderInventory();

}
if ( view === 'shop' ) { state.giveBoat( 'workboat' ); state.money = 2400; state.buy( 'reel' ); h.openStand( { kind: 'shop', name: 'Marta · Chandlery', greeting: 'Line, reels, a bigger hold, diesel. What do you need?' } ); }
if ( view === 'stand' ) h.openStand( { name: 'Joe · Fish buyer', greeting: 'Let\'s see what you caught. Fair prices, cash.' } );
if ( view === 'fight' ) ui.toast( 'Fish on!' );
// ?view=start: the start screen with the name and avatar; ?view=chat: the chat log, its line open
if ( view === 'start' ) {

	const { UI } = await import( '../src/ui/UI.js' );
	const { mountProfile } = await import( '../src/net/StartProfile.js' );
	const u = new UI();
	await u.hideLoader();
	const inner = u.startEl.querySelector( '.tw-start-inner' );
	window.__profile = mountProfile( inner, inner.querySelector( '.tw-start-cta' ) );
	u.showStartOverlay( () => ( window.__started = window.__profile.get() ) );

}
if ( view === 'chat' ) {

	const { Chat } = await import( '../src/net/Chat.js' );
	const chat = new Chat( hud, { say: ( s ) => ( chat.add( 'Kaleomi', s, '#3fb6c8', true ), true ) } );
	chat.system( '阿海 来到了这片海' );
	chat.add( '阿海', '你在哪个岛？', '#5fbf6a' );
	chat.add( 'Kaleomi', '珊瑚环礁这边，刚钓到一条鬼头刀', '#3fb6c8', true );
	chat.add( 'Marisol', 'nice!! 我也过去', '#9b6ad6' );
	chat.show();

}
if ( [ 'catch', 'record', 'newspecies', 'full', 'milestone', 'legend' ].includes( view ) ) {

	// the landed-fish backdrop the card sits beside (in game: the real fish on the line)
	document.body.style.background = 'radial-gradient(40% 50% at 62% 50%, #3d6f7a 0%, transparent 70%), linear-gradient(180deg, #6fa7d6 0%, #9cc9e8 45%, #1f8fa3 46%, #0c5f77 100%)';
	if ( view === 'catch' ) state.addFish( 'yellowtail', 0.92, 9 );
	if ( view === 'record' ) state.addFish( 'jack', 6.35, 9 );
	if ( view === 'newspecies' ) state.addFish( 'mahi', 11.4, 12 );
	if ( view === 'milestone' ) state.addFish( 'tuna', 13.2, 18 ); // the fifth species, at gold
	if ( view === 'legend' ) state.addLegend( 'silverKing', 51.8 );
	if ( view === 'full' ) { state.addFish( 'grouper', 12, 9 ); state.addFish( 'tarpon', 38.5, 22 ); }
	h.showCatch( state.lastCatch );

}
</script>
</body>
</html>
