name: Deploy to GitHub Pages
# and to Cloudflare Pages too, once the repo has the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the tests render headless through Dawn; Mesa's software Vulkan (lavapipe) stands in for a GPU
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # the same tested build, uploaded to the Cloudflare Pages project "sea-world" (custom domain set in the
  # Cloudflare dashboard). Skips itself without the secrets, so forks and GitHub Pages alone keep working.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets, skipping the Cloudflare Pages deploy"; exit 0
          fi
          mkdir dist && tar -xf artifact.tar -C dist
          npx --yes wrangler@4 pages project list | grep -qw sea-world \
            || npx --yes wrangler@4 pages project create sea-world --production-branch main
          npx --yes wrangler@4 pages deploy dist --project-name sea-world --branch main --commit-dirty=true
